<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 40">
  <defs>
    <style>
      .logo-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; letter-spacing: -0.01em; }
      .py-accent { fill: #0F766E; }
      .quantlib { fill: #1F2937; }
      @media (prefers-color-scheme: dark) {
        .py-accent { fill: #2DD4BF; }
        .quantlib { fill: #E5E7EB; }
      }
    </style>
  </defs>

  <!-- Icon mark: rounded teal square with bold Q -->
  <rect x="0" y="4" width="32" height="32" rx="7" fill="#0F766E"/>
  <text x="16" y="28"
        text-anchor="middle"
        class="logo-text"
        font-size="22"
        fill="white">Q</text>

  <!-- Wordmark -->
  <text x="44" y="29" class="logo-text" font-size="26">
    <tspan class="py-accent">Py</tspan><tspan class="quantlib">QuantLib</tspan>
  </text>
</svg>
